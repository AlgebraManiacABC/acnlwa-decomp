name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.version }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/algebramaniacabc/acnlwa-build:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        version: [CTR-P-EAAE]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pipeline
        uses: actions/checkout@v4
        with:
          repository: AlgebraManiacABC/3dsd
          path: pipeline
          ref: main  # pin to a release tag once one exists

      - name: Install pipeline dependencies
        run: pip install pyyaml ninja --break-system-packages

      - name: Set up tools and originals
        run: |
          ln -s /tools versions/${{ matrix.version }}/tools
          cp -r /versions/${{ matrix.version }}/orig/. versions/${{ matrix.version }}/orig/

      - name: Run pipeline
        run: PYTHONPATH=pipeline python -m 3dsd build versions/${{ matrix.version }}

      - name: Verify binaries
        run: PYTHONPATH=pipeline python -m 3dsd check versions/${{ matrix.version }}

      - name: Upload objdiff.json
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.version }}_objdiff
          path: versions/${{ matrix.version }}/objdiff.json

      - name: Generate progress report
        run: |
          curl -fSL --retry 3 https://github.com/encounter/objdiff/releases/latest/download/objdiff-cli-linux-x86_64 \
            -o /usr/local/bin/objdiff-cli
          chmod +x /usr/local/bin/objdiff-cli
          objdiff-cli report generate -o versions/${{ matrix.version }}/build/report.json \
            --project versions/${{ matrix.version }}

      - name: Upload progress report
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.version }}_report
          path: versions/${{ matrix.version }}/build/report.json
